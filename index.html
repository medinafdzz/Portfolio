    <script>
      (() => {
        const validLanguages = ['es', 'en'];
        let storedLanguage = null;

        try {
          storedLanguage = localStorage.getItem('portfolio-language');
        } catch {
          // The application falls back to session-only preferences.
        }

        const language = validLanguages.includes(storedLanguage) ? storedLanguage : 'es';

        document.documentElement.lang = language;
      })();
    </script>
